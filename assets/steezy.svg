<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" fill="none" font-family="'JetBrains Mono','SFMono-Regular','Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <clipPath id="win"><rect x="20" y="18" width="860" height="334" rx="13"/></clipPath>
    <clipPath id="c1"><rect x="40" y="80" width="0" height="22"><animate attributeName="width" values="0;0;230;230" keyTimes="0;.031;.092;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="110" width="0" height="22"><animate attributeName="width" values="0;0;330;330" keyTimes="0;.108;.162;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="148" width="0" height="22"><animate attributeName="width" values="0;0;300;300" keyTimes="0;.177;.246;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="178" width="0" height="22"><animate attributeName="width" values="0;0;460;460" keyTimes="0;.262;.331;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="216" width="0" height="22"><animate attributeName="width" values="0;0;360;360" keyTimes="0;.346;.423;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="cbar"><rect x="44" y="252" width="0" height="16"><animate attributeName="width" values="0;0;232;232" keyTimes="0;.438;.577;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes scan  { from{transform:translateY(-10px)} to{transform:translateY(360px)} }
      @keyframes gC { 0%,90%,100%{transform:translate(0,0)} 91%{transform:translate(-3px,2px)} 93%{transform:translate(4px,-2px)} 95%{transform:translate(-2px,1px)} }
      @keyframes gM { 0%,90%,100%{transform:translate(0,0)} 91%{transform:translate(3px,-2px)} 93%{transform:translate(-4px,2px)} 95%{transform:translate(2px,-1px)} }
      .cur  { animation:blink 1s steps(1) infinite; }
      .scanline { animation:scan 6s linear infinite; }
      .nmC { animation:gC 4s steps(1) infinite; }
      .nmM { animation:gM 4s steps(1) infinite; }
      .ln  { font-size:16px; }
      .prompt { fill:#3fb950; font-weight:600; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#05070d"/>

  <g clip-path="url(#win)">
    <rect x="20" y="18" width="860" height="334" fill="url(#bg)"/>
    <rect x="20" y="18" width="860" height="38" fill="#161b22"/>
    <circle cx="42" cy="37" r="6" fill="#ff5f56"/>
    <circle cx="64" cy="37" r="6" fill="#ffbd2e"/>
    <circle cx="86" cy="37" r="6" fill="#27c93f"/>
    <text x="450" y="42" text-anchor="middle" fill="#7d8590" font-size="13">enzo@steezy — zsh — 80&#215;24</text>

    <g clip-path="url(#c1)" class="ln">
      <text x="40" y="96"><tspan class="prompt">enzo@steezy:~$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
    </g>
    <g clip-path="url(#c2)" class="ln">
      <text x="40" y="126" fill="#56d4dd">&#8627; Enzo "Steezy" Petit — Software Engineer &#215; AI</text>
    </g>
    <g clip-path="url(#c3)" class="ln">
      <text x="40" y="164"><tspan class="prompt">enzo@steezy:~$</tspan><tspan fill="#e6edf3"> cat stack.json</tspan></text>
    </g>
    <g clip-path="url(#c4)" class="ln">
      <text x="40" y="194"><tspan fill="#7d8590">{ </tspan><tspan fill="#bc8cff">"lang"</tspan><tspan fill="#7d8590">: </tspan><tspan fill="#a5d6ff">"C&#183;C++&#183;Py&#183;TS&#183;Go"</tspan><tspan fill="#7d8590">, </tspan><tspan fill="#bc8cff">"focus"</tspan><tspan fill="#7d8590">: </tspan><tspan fill="#a5d6ff">"AI / Systems / Web"</tspan><tspan fill="#7d8590"> }</tspan></text>
    </g>
    <g clip-path="url(#c5)" class="ln">
      <text x="40" y="232"><tspan class="prompt">enzo@steezy:~$</tspan><tspan fill="#e6edf3"> sudo ./launch --mode=god</tspan></text>
    </g>

    <rect x="44" y="252" width="232" height="16" rx="8" fill="#21262d"/>
    <g clip-path="url(#cbar)"><rect x="44" y="252" width="232" height="16" rx="8" fill="url(#bar)"/></g>
    <text x="288" y="265" font-size="14" fill="#7d8590">deploying steezy.exe</text>

    <g class="ln">
      <text x="40" y="306" fill="#3fb950" opacity="0">&#10003; all systems online — welcome.
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.59;.61;1" dur="13s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect class="cur" x="0" y="0" width="10" height="19" fill="#2dd4bf">
      <animateTransform attributeName="transform" type="translate" calcMode="discrete"
        values="246,80; 246,80; 350,110; 320,148; 480,178; 388,216; 388,216; 320,288; 320,288"
        keyTimes="0; .031; .108; .177; .262; .346; .438; .592; 1" dur="13s" repeatCount="indefinite"/>
    </rect>

    <rect class="scanline" x="20" y="18" width="860" height="60" fill="#2dd4bf" opacity="0.05"/>
  </g>

  <g text-anchor="middle" font-size="92" font-weight="800" letter-spacing="8">
    <text class="nmC" x="450" y="436" fill="#2dd4bf" opacity="0.75">STEEZY</text>
    <text class="nmM" x="450" y="436" fill="#ff2e97" opacity="0.75">STEEZY</text>
    <text x="450" y="436" fill="#e6edf3">STEEZY</text>
  </g>
  <text x="450" y="474" text-anchor="middle" fill="#3fb950" font-size="15" letter-spacing="6">&#9608; BUILDING THINGS THAT THINK &#9608;</text>

  <rect x="0" y="0" width="900" height="500" fill="url(#vig)"/>
  <rect x="20" y="18" width="860" height="334" rx="13" fill="none" stroke="#1f6feb" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
