<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" fill="none" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="rainFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="rainMask">
      <rect x="0" y="0" width="1000" height="320" fill="url(#rainFade)"/>
    </mask>
    <clipPath id="frame">
      <rect x="2" y="2" width="996" height="316" rx="14"/>
    </clipPath>
    <clipPath id="type">
      <rect x="118" y="252" width="0" height="26">
        <animate attributeName="width" values="0;0;360" keyTimes="0;0.18;0.5" dur="6s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes fall { from{transform:translateY(-280px)} to{transform:translateY(320px)} }
      @keyframes flick { 0%,96%,100%{opacity:.45} 97%{opacity:.15} 98%{opacity:.6} }
      @keyframes scan { from{transform:translateY(-20px)} to{transform:translateY(340px)} }
      @keyframes nameIn { 0%,46%{opacity:0;transform:translateY(8px)} 54%,100%{opacity:1;transform:translateY(0)} }
      @keyframes gC { 0%,88%,100%{transform:translate(0,0)} 90%{transform:translate(-4px,2px)} 92%{transform:translate(3px,-2px)} 94%{transform:translate(-2px,1px)} }
      @keyframes gM { 0%,88%,100%{transform:translate(0,0)} 90%{transform:translate(4px,-2px)} 92%{transform:translate(-3px,2px)} 94%{transform:translate(2px,-1px)} }
      @keyframes tagIn { 0%,58%{opacity:0} 70%,100%{opacity:.85} }
      .rain { fill:#00ff9c; font-size:18px; writing-mode:tb; letter-spacing:2px; animation:fall linear infinite; }
      .cur  { animation:blink 1s steps(1) infinite; }
      .name { font-size:96px; font-weight:800; }
      .scanline { animation:scan 5s linear infinite; }
      .crt { animation:flick 4s ease-in-out infinite; }
      .nm0 { animation:nameIn 6s ease-out infinite; }
      .nmC { animation:gC 5s steps(1) infinite; }
      .nmM { animation:gM 5s steps(1) infinite; }
      .tag { animation:tagIn 6s ease-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1000" height="320" fill="url(#bg)"/>

    <g mask="url(#rainMask)" opacity="0.5">
      <text class="rain" x="40"  y="0" style="animation-duration:4.2s;animation-delay:-1.0s">01001011001</text>
      <text class="rain" x="110" y="0" style="animation-duration:6.1s;animation-delay:-3.2s">10110100110</text>
      <text class="rain" x="180" y="0" style="animation-duration:3.6s;animation-delay:-0.4s">11010011010</text>
      <text class="rain" x="250" y="0" style="animation-duration:5.4s;animation-delay:-2.1s">00101101001</text>
      <text class="rain" x="320" y="0" style="animation-duration:4.8s;animation-delay:-4.0s">10011010110</text>
      <text class="rain" x="690" y="0" style="animation-duration:4.0s;animation-delay:-1.7s">01101001011</text>
      <text class="rain" x="760" y="0" style="animation-duration:6.4s;animation-delay:-0.9s">11001011010</text>
      <text class="rain" x="830" y="0" style="animation-duration:3.9s;animation-delay:-2.8s">00110101100</text>
      <text class="rain" x="900" y="0" style="animation-duration:5.2s;animation-delay:-3.6s">10100110011</text>
      <text class="rain" x="960" y="0" style="animation-duration:4.5s;animation-delay:-1.3s">01011010010</text>
    </g>

    <g class="name" text-anchor="middle" letter-spacing="6">
      <text class="nmC" x="500" y="158" fill="#22d3ee" opacity="0.8">STEEZY</text>
      <text class="nmM" x="500" y="158" fill="#ff2e97" opacity="0.8">STEEZY</text>
      <text class="nm0" x="500" y="158" fill="#e6edf3">STEEZY</text>
    </g>

    <text class="tag" x="500" y="196" text-anchor="middle" fill="#00ff9c" font-size="17" letter-spacing="5">
      SOFTWARE ENGINEER &#215; AI SPECIALIST
    </text>

    <text x="40" y="272" fill="#7ee787" font-size="18" font-weight="600">enzo@steezy:~$</text>
    <g clip-path="url(#type)">
      <text x="118" y="272" fill="#e6edf3" font-size="18">./launch_steezy.sh --mode=god</text>
    </g>
    <rect class="cur" x="484" y="256" width="11" height="20" fill="#00ff9c"/>

    <rect class="scanline crt" x="0" y="0" width="1000" height="3" fill="#00ff9c" opacity="0.4"/>
    <rect x="2" y="2" width="996" height="316" rx="14" fill="none" stroke="#1f6feb" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
</svg>
